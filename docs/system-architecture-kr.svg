<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100" font-family="Malgun Gothic, Segoe UI, Apple SD Gothic Neo, sans-serif">
  <!--
    레이아웃 기준 (카드가 계층 박스를 넘지 않도록 가용 폭에서 역산)
      계층 박스 : x = 100 .. 1100  (w = 1000),  높이 186
      카드 영역 : x = 130 .. 1070  (안쪽 여백 30, 가용 폭 940)
        카드 3개 : w = 302, 간격 17  ->  130, 449, 768
        카드 4개 : w = 223, 간격 16  ->  130, 369, 608, 847
      계층 T 기준 : 배지 cy = T+38, 제목 y = T+45, 카드 y = T+70 (높이 100)
  -->

  <text font-size="28px" font-weight="700" fill="#1A2230" x="600" y="46" text-anchor="middle">BabySense 시스템 구성도</text>
  <text font-size="15px" fill="#6B7280" x="600" y="78" text-anchor="middle">입력 → 저장 → 판정 → 행동 가이드 반환의 4계층 구조</text>

  <!-- ============ (a) 클라이언트 계층 : 106 .. 292 ============ -->
  <rect x="100" y="106" width="1000" height="186" rx="10" fill="#E9F0F9" stroke="#5A6B85" stroke-width="1.6"/>
  <circle fill="#ffffff" stroke="#1A2230" stroke-width="1.8" cx="152" cy="144" r="22"/>
  <text font-size="16px" font-weight="700" fill="#1A2230" x="152" y="150" text-anchor="middle">a</text>
  <text font-size="19px" font-weight="700" fill="#1A2230" x="190" y="151">클라이언트 계층 (Client Layer)</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="130" y="176" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="281" y="202" text-anchor="middle">Flutter · Dart</text>
  <text font-size="13px" fill="#4A5260" x="281" y="224" text-anchor="middle">크로스플랫폼 모바일 앱</text>
  <text font-size="13px" fill="#4A5260" x="281" y="242" text-anchor="middle">iOS · Android 동시 지원</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="449" y="176" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="600" y="202" text-anchor="middle">간편 로그인</text>
  <text font-size="13px" fill="#4A5260" x="600" y="224" text-anchor="middle">카카오 · 구글 (애플 예정)</text>
  <text font-size="13px" fill="#4A5260" x="600" y="242" text-anchor="middle">Supabase Auth 연동</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="768" y="176" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="919" y="202" text-anchor="middle">입력 · 조회 · 측정</text>
  <text font-size="13px" fill="#4A5260" x="919" y="224" text-anchor="middle">상태 입력 · 결과 조회</text>
  <text font-size="13px" fill="#4A5260" x="919" y="242" text-anchor="middle">소음 측정 · 알림 수신</text>

  <path stroke="#2E6E9E" stroke-width="3" fill="none" d="M 340 344 L 340 306"/>
  <path d="M 332 308 L 340 296 L 348 308 z" fill="#2E6E9E"/>
  <text font-size="14px" fill="#2E6E9E" x="328" y="326" text-anchor="end">판정 + 행동 가이드</text>
  <path stroke="#B03A2E" stroke-width="3" fill="none" d="M 860 296 L 860 334"/>
  <path d="M 852 332 L 860 344 L 868 332 z" fill="#B03A2E"/>
  <text font-size="14px" fill="#B03A2E" x="874" y="326">입력 데이터 (HTTPS)</text>

  <!-- ============ (b) 애플리케이션 계층 : 348 .. 534 ============ -->
  <rect x="100" y="348" width="1000" height="186" rx="10" fill="#E3EFE6" stroke="#5A7562" stroke-width="1.6"/>
  <circle fill="#ffffff" stroke="#1A2230" stroke-width="1.8" cx="152" cy="386" r="22"/>
  <text font-size="16px" font-weight="700" fill="#1A2230" x="152" y="392" text-anchor="middle">b</text>
  <text font-size="19px" font-weight="700" fill="#1A2230" x="190" y="393">애플리케이션 계층 (Application Layer)</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="130" y="418" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="281" y="444" text-anchor="middle">FastAPI 통합 백엔드</text>
  <text font-size="13px" fill="#4A5260" x="281" y="466" text-anchor="middle">요청 라우팅 · 응답 조립</text>
  <text font-size="13px" fill="#4A5260" x="281" y="484" text-anchor="middle">상담 · 피부 판독만 경유</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="449" y="418" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="600" y="444" text-anchor="middle">인증 · 요청 제약 확인</text>
  <text font-size="13px" fill="#4A5260" x="600" y="466" text-anchor="middle">Supabase Auth 토큰 검증</text>
  <text font-size="13px" fill="#4A5260" x="600" y="484" text-anchor="middle">질문 길이 · 이미지 형식 · 호출 상한</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="768" y="418" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="919" y="444" text-anchor="middle">외부 AI API 키 보호</text>
  <text font-size="13px" fill="#4A5260" x="919" y="466" text-anchor="middle">API 호출을 서버로 한정</text>
  <text font-size="13px" fill="#4A5260" x="919" y="484" text-anchor="middle">앱 역컴파일 시 탈취 방지</text>

  <path stroke="#2E6E9E" stroke-width="3" fill="none" d="M 340 586 L 340 548"/>
  <path d="M 332 550 L 340 538 L 348 550 z" fill="#2E6E9E"/>
  <text font-size="14px" fill="#2E6E9E" x="328" y="568" text-anchor="end">분석 결과</text>
  <path stroke="#B03A2E" stroke-width="3" fill="none" d="M 860 538 L 860 576"/>
  <path d="M 852 574 L 860 586 L 868 574 z" fill="#B03A2E"/>
  <text font-size="14px" fill="#B03A2E" x="874" y="568">분석 요청</text>

  <!-- ============ (c) 분석 계층 : 590 .. 776 ============ -->
  <rect x="100" y="590" width="1000" height="186" rx="10" fill="#FCF0DC" stroke="#8A7A5A" stroke-width="1.6"/>
  <circle fill="#ffffff" stroke="#1A2230" stroke-width="1.8" cx="152" cy="628" r="22"/>
  <text font-size="16px" font-weight="700" fill="#1A2230" x="152" y="634" text-anchor="middle">c</text>
  <text font-size="19px" font-weight="700" fill="#1A2230" x="190" y="635">분석 계층 (Analysis Layer)</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="130" y="660" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="281" y="686" text-anchor="middle">규칙 기반 판정 엔진 (앱 내)</text>
  <text font-size="13px" fill="#4A5260" x="281" y="708" text-anchor="middle">연령대별 임계값 적용</text>
  <text font-size="13px" fill="#4A5260" x="281" y="726" text-anchor="middle">체온 · 성장 · 소음</text>
  <text font-size="13px" fill="#4A5260" x="281" y="744" text-anchor="middle">정상 · 주의 · 상담 권장</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="449" y="660" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="600" y="686" text-anchor="middle">외부 LLM API 연동</text>
  <text font-size="13px" fill="#4A5260" x="600" y="708" text-anchor="middle">확정된 판정을 맥락으로 받음</text>
  <text font-size="13px" fill="#4A5260" x="600" y="726" text-anchor="middle">상담 대화 담당 · 판정 불변</text>
  <text font-size="13px" fill="#4A5260" x="600" y="744" text-anchor="middle">판독 불가 시 진료 권유</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="768" y="660" width="302" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="919" y="686" text-anchor="middle">피부 이미지 해석 모듈</text>
  <text font-size="13px" fill="#4A5260" x="919" y="708" text-anchor="middle">외부 비전 LLM 호출</text>
  <text font-size="13px" fill="#4A5260" x="919" y="726" text-anchor="middle">병명 · 확률 반환 안 함</text>
  <text font-size="13px" fill="#4A5260" x="919" y="744" text-anchor="middle">관찰 서술 + 2단계 안내</text>

  <path stroke="#2E6E9E" stroke-width="3" fill="none" d="M 340 828 L 340 790"/>
  <path d="M 332 792 L 340 780 L 348 792 z" fill="#2E6E9E"/>
  <text font-size="14px" fill="#2E6E9E" x="328" y="810" text-anchor="end">기록 데이터</text>
  <path stroke="#B03A2E" stroke-width="3" fill="none" d="M 860 780 L 860 818"/>
  <path d="M 852 816 L 860 828 L 868 816 z" fill="#B03A2E"/>
  <text font-size="14px" fill="#B03A2E" x="874" y="810">조회 · 저장</text>

  <!-- ============ (d) 데이터 · 인프라 계층 : 832 .. 1018 ============ -->
  <rect x="100" y="832" width="1000" height="186" rx="10" fill="#EFE6F2" stroke="#7A6A85" stroke-width="1.6"/>
  <circle fill="#ffffff" stroke="#1A2230" stroke-width="1.8" cx="152" cy="870" r="22"/>
  <text font-size="16px" font-weight="700" fill="#1A2230" x="152" y="876" text-anchor="middle">d</text>
  <text font-size="19px" font-weight="700" fill="#1A2230" x="190" y="877">데이터 · 인프라 계층 (Data &amp; Infra Layer)</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="130" y="902" width="223" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="242" y="940" text-anchor="middle">Supabase Postgres</text>
  <text font-size="13px" fill="#4A5260" x="242" y="966" text-anchor="middle">19개 테이블 · RLS</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="369" y="902" width="223" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="481" y="940" text-anchor="middle">Supabase Auth</text>
  <text font-size="13px" fill="#4A5260" x="481" y="966" text-anchor="middle">소셜 로그인 · 세션</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="608" y="902" width="223" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="720" y="940" text-anchor="middle">(미사용)</text>
  <text font-size="13px" fill="#4A5260" x="720" y="966" text-anchor="middle">사진은 저장하지 않음</text>

  <rect fill="#ffffff" stroke="#3A4250" stroke-width="1.4" x="847" y="902" width="223" height="100" rx="7"/>
  <text font-size="15px" font-weight="700" fill="#1A2230" x="959" y="940" text-anchor="middle">Firebase FCM</text>
  <text font-size="13px" fill="#4A5260" x="959" y="966" text-anchor="middle">서버 알림 · device_tokens</text>

  <text font-size="14px" fill="#6B7280" x="600" y="1058" text-anchor="middle">※ 본 시스템의 분석 결과는 참고용이며 의료적 진단을 대체하지 않는다.</text>
</svg>
