<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    Boxes are 230 wide so the longest label (code · recommended_age_months)
    still leaves a wide margin even if the renderer substitutes a wider font.
      columns : x = 110, 360, 610, 860   (w = 230, gap 20)  ->  centres 225, 475, 725, 975
      row 1   : y = 350     row 2 : y = 510     row 3 : y = 630
    Every connector is a straight vertical on a column centre, or threads the
    590..610 gap, so no line ever crosses a box.
  -->

  <!-- ============ Level 0 : Supabase Auth ============ -->
  <rect fill="#ededed" stroke="#333333" stroke-width="1.4" stroke-dasharray="5 3" x="485" y="30" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="600" y="52" text-anchor="middle">auth.users</text>
  <text font-size="10px" fill="#555555" x="600" y="70" text-anchor="middle">id (PK) · email</text>

  <!-- ============ Level 1 ============ -->
  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="150" y="130" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="265" y="152" text-anchor="middle">profiles</text>
  <text font-size="10px" fill="#555555" x="265" y="170" text-anchor="middle">id (PK, FK) · name</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="820" y="130" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="935" y="152" text-anchor="middle">device_tokens</text>
  <text font-size="10px" fill="#555555" x="935" y="170" text-anchor="middle">id (PK) · user_id (FK)</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="485" y="222" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="600" y="244" text-anchor="middle">babies</text>
  <text font-size="10px" fill="#555555" x="600" y="262" text-anchor="middle">id (PK) · user_id (FK)</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 520 82 L 300 130"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="510" y="98">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="308" y="124">1</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 680 82 L 900 130"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="686" y="98">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="884" y="124">N</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 600 82 L 600 222"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="607" y="100">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="607" y="216">N</text>

  <!-- ============ Level 2, row 1 ============ -->
  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="110" y="350" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="225" y="372" text-anchor="middle">growth_records</text>
  <text font-size="10px" fill="#555555" x="225" y="390" text-anchor="middle">height_cm · weight_kg</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="360" y="350" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="475" y="372" text-anchor="middle">feeding_records</text>
  <text font-size="10px" fill="#555555" x="475" y="390" text-anchor="middle">feeding_type · amount_ml</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="610" y="350" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="725" y="372" text-anchor="middle">diaper_records</text>
  <text font-size="10px" fill="#555555" x="725" y="390" text-anchor="middle">diaper_type · stool_state</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="860" y="350" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="975" y="372" text-anchor="middle">skin_analyses</text>
  <text font-size="10px" fill="#555555" x="975" y="390" text-anchor="middle">image_path · probability</text>

  <!-- ============ Level 2, row 2 ============ -->
  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="110" y="510" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="225" y="532" text-anchor="middle">sleep_records</text>
  <text font-size="10px" fill="#555555" x="225" y="550" text-anchor="middle">sleep_type · started_at</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="360" y="510" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="475" y="532" text-anchor="middle">temperature_records</text>
  <text font-size="10px" fill="#555555" x="475" y="550" text-anchor="middle">temperature_c · measured_at</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="610" y="510" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="725" y="532" text-anchor="middle">vaccination_records</text>
  <text font-size="10px" fill="#555555" x="725" y="550" text-anchor="middle">scheduled_on · vaccinated_on</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="860" y="510" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="975" y="532" text-anchor="middle">assessments</text>
  <text font-size="10px" fill="#555555" x="975" y="550" text-anchor="middle">level · guide_text · inputs</text>

  <!-- babies -> bus 1 (y = 310) -> row 1 -->
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 600 274 L 600 310"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="607" y="294">1</text>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 225 310 L 975 310"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 225 310 L 225 350"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 475 310 L 475 350"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 725 310 L 725 350"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 975 310 L 975 350"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="231" y="342">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="481" y="342">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="731" y="342">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="981" y="342">N</text>

  <!-- bus 1 -> bus 2 (y = 470) through the 590..610 gap in row 1 -->
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 600 310 L 600 470"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 225 470 L 975 470"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 225 470 L 225 510"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 475 470 L 475 510"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 725 470 L 725 510"/>
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 975 470 L 975 510"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="231" y="502">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="481" y="502">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="731" y="502">N</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="981" y="502">N</text>

  <!-- ============ Level 3 ============ -->
  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="110" y="630" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="225" y="652" text-anchor="middle">sleep_noise_logs</text>
  <text font-size="10px" fill="#555555" x="225" y="670" text-anchor="middle">measured_at · decibel</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="360" y="630" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="475" y="652" text-anchor="middle">temperature_symptoms</text>
  <text font-size="10px" fill="#555555" x="475" y="670" text-anchor="middle">record_id + symptom (PK)</text>

  <rect fill="#f5f5f5" stroke="#333333" stroke-width="1.4" x="610" y="630" width="230" height="52" rx="4"/>
  <text font-size="13px" font-weight="600" fill="#111111" x="725" y="652" text-anchor="middle">vaccines</text>
  <text font-size="10px" fill="#555555" x="725" y="670" text-anchor="middle">code · recommended_age_months</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 225 562 L 225 630"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="231" y="582">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="231" y="624">N</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 475 562 L 475 630"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="481" y="582">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="481" y="624">N</text>

  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 725 630 L 725 562"/>
  <text font-size="10px" fill="#111111" font-weight="600" x="731" y="624">1</text>
  <text font-size="10px" fill="#111111" font-weight="600" x="731" y="582">N</text>

  <text font-size="10px" fill="#666666" x="866" y="652">babies and vaccines form an M:N</text>
  <text font-size="10px" fill="#666666" x="866" y="668">relationship, resolved by</text>
  <text font-size="10px" fill="#666666" x="866" y="684">vaccination_records.</text>

  <!-- ============ Legend ============ -->
  <path stroke="#333333" stroke-width="1.2" fill="none" d="M 110 738 L 1090 738"/>
  <text font-size="12px" font-weight="700" fill="#111111" x="110" y="762">Legend</text>

  <rect fill="#ededed" stroke="#333333" stroke-width="1.4" stroke-dasharray="5 3" x="180" y="750" width="24" height="14" rx="3"/>
  <text font-size="10px" fill="#666666" x="212" y="762">Managed by Supabase Auth</text>

  <rect fill="#f5f5f5" stroke="#333333" stroke-width="1.4" x="400" y="750" width="24" height="14" rx="3"/>
  <text font-size="10px" fill="#666666" x="432" y="762">Shared reference data (read-only)</text>

  <rect fill="#ffffff" stroke="#333333" stroke-width="1.4" x="700" y="750" width="24" height="14" rx="3"/>
  <text font-size="10px" fill="#666666" x="732" y="762">Application table (Row Level Security applied)</text>

  <text font-size="10px" fill="#666666" x="110" y="792">1 : N  one-to-many</text>
  <text font-size="10px" fill="#666666" x="260" y="792">1 : 1  one-to-one</text>
  <text font-size="10px" fill="#666666" x="400" y="792">All foreign keys are declared with CASCADE or RESTRICT.</text>

  <text font-size="10px" fill="#666666" x="110" y="816">Each box lists key attributes only. Full column definitions are given in the accompanying table.</text>
  <text font-size="10px" fill="#666666" x="110" y="838">Every record table references babies directly, so each record carries its own timestamp.</text>
</svg>
