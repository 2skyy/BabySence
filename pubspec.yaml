name: flutter_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  desktop_drop: ^0.4.4
  http: ^1.6.0
  noise_meter: ^5.1.0
  permission_handler: ^12.0.3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_background_service_ios: ^5.0.3
  flutter_local_notifications: ^22.0.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  image_picker: ^1.2.2
  file_selector: ^1.1.0
  file_picker: ^11.0.2

  # 오디오 플레이어 패키지
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kakao_logo.png
    - assets/images/google_logo.png
    - assets/images/apple_logo.png

    # ★ 수정: assets/audio/ 폴더 전체 등록 (개별 파일 대신 폴더 경로 지정)
    - assets/audio/