name: flutter_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # 시간·날짜 선택기를 한국어로 띄우기 위한 것입니다. 없으면 'Select time',
  # 'CANCEL' 처럼 영어로 나옵니다.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  noise_meter: ^5.1.0
  permission_handler: ^12.0.3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_background_service_ios: ^5.0.3
  flutter_local_notifications: ^22.0.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  # 수유 알림 예약(zonedSchedule)에 직접 씁니다. flutter_local_notifications가
  # 함께 끌어오지만, 직접 import하므로 명시합니다.
  timezone: ^0.11.1
  dio: ^5.9.2
  image_picker: ^1.2.2

  # 오디오 플레이어 패키지
  audioplayers: ^6.1.0
  supabase_flutter: ^2.16.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kakao_logo.png
    - assets/images/google_logo.png
    - assets/images/apple_logo.png

    # 앱 아이콘 원본. 실행 직후 로딩 화면에서도 씁니다.
    - assets/icon/app_icon.png

    # 홈의 상담 단추용. 앱 아이콘의 배경만 어둡게 내린 것입니다
    # (tool/make_chat_logo.py). 밝은 민트 위 흰 선은 대비가 1.35:1이라
    # 선이 보이지 않았고, 홈의 다른 강조색과도 따로 놀았습니다.
    - assets/icon/chat_logo.png

    # ★ 수정: assets/audio/ 폴더 전체 등록 (개별 파일 대신 폴더 경로 지정)
    - assets/audio/